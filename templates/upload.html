<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>感恩牆 — 分享你的訊息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1rem;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        
        .required {
            color: #dc3545;
        }
        
        .required-note {
            text-align: left;
            margin-top: 10px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            color: #666;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .file-input-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
            width: 100%;
        }
        
        .file-input {
            opacity: 0;
            position: absolute;
            z-index: -1;
        }
        
        .file-input-button {
            display: block;
            padding: 12px;
            background: #667eea;
            border: 2px solid #667eea;
            border-radius: 10px;
            text-align: center;
            color: white;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .file-input-button:hover {
            background: #5a67d8;
            border-color: #5a67d8;
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .response {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        
        .response.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .response.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>感恩牆</h1>
            <p>即時分享你的感恩訊息</p>
        </div>
        
        <form id="upload-form">
            <div class="form-group">
                <label for="message">感恩訊息 <span class="required">*</span></label>
                <textarea id="message" name="message" required placeholder="分享你感恩的事..."></textarea>
            </div>

            <div class="form-group">
                <label for="user_name">你的名字</label>
                <input type="text" id="user_name" name="user_name" placeholder="匿名...">
            </div>

            <div class="form-group">
                <label for="group_name">所屬團體</label>
                <input type="text" id="group_name" name="group_name" placeholder="例如：成崇、D21...">
            </div>

            <div class="form-group">
                <label for="event">活動</label>
                <input type="text" id="event" name="event" placeholder="例如：感恩分享會...">
            </div>

            <div class="form-group">
                <label for="image">上傳照片</label>
                <div class="file-input-wrapper">
                    <input type="file" id="image" name="image" accept="image/*" class="file-input">
                    <div class="file-input-button">📸 點擊選擇檔案</div>
                </div>
            </div>

            <div class="required-note">
                <span class="required">*</span> 必填欄位
            </div>
            
            <button type="submit" class="submit-btn">分享訊息</button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>正在上傳你的訊息...</div>
        </div>

        <div id="response" class="response"></div>
    </div>

    <script>
        const form = document.getElementById("upload-form");
        const loading = document.getElementById("loading");
        const response = document.getElementById("response");
        const fileInput = document.getElementById("image");
        const fileButton = document.querySelector(".file-input-button");
        const submitBtn = document.querySelector(".submit-btn");
        const FILE_BUTTON_LABEL = "📸 點擊選擇檔案";
        const SUBMIT_LABEL = "分享訊息";
        const MAX_UPLOAD_MB = {{ max_upload_mb }};

        // Server messages are plain text; escape them before putting them in the page
        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }
        
        // File button click handler
        fileButton.addEventListener("click", function() {
            fileInput.click();
        });
        
        // File input handling
        fileInput.addEventListener("change", function() {
            if (this.files.length > 0) {
                fileButton.textContent = `📸 ${this.files[0].name}`;
            } else {
                fileButton.textContent = FILE_BUTTON_LABEL;
            }
        });
        
        // Form submission
        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            // Catch oversize photos before spending time uploading them
            if (fileInput.files.length > 0 && fileInput.files[0].size > MAX_UPLOAD_MB * 1024 * 1024) {
                response.style.display = "block";
                response.className = "response error";
                response.innerHTML = `
                    <strong>❌ 照片檔案太大</strong><br>
                    上限為 ${MAX_UPLOAD_MB} MB，請選擇較小的照片再試一次。
                `;
                return;
            }

            // Show loading state
            loading.style.display = "block";
            response.style.display = "none";
            submitBtn.disabled = true;
            submitBtn.textContent = "分享中...";

            const formData = new FormData();
            formData.append("message", document.getElementById("message").value);
            formData.append("user_name", document.getElementById("user_name").value);
            formData.append("group_name", document.getElementById("group_name").value);
            formData.append("event", document.getElementById("event").value);
            
            // Add image if selected
            if (fileInput.files.length > 0) {
                formData.append("image", fileInput.files[0]);
            }

            try {
                const res = await fetch("/upload", {
                    method: "POST",
                    body: formData
                });

                const result = await res.json();
                
                // Hide loading
                loading.style.display = "none";
                submitBtn.disabled = false;
                submitBtn.textContent = SUBMIT_LABEL;
                
                // Show response
                response.style.display = "block";
                
                if (result.status === "success") {
                    response.className = "response success";
                    response.innerHTML = `
                        <strong>✅ 訊息分享成功！</strong><br>
                        ${result.warning ? `<em>⚠️ ${escapeHtml(result.warning)}</em><br>` : ''}
                        你的訊息將會顯示在螢幕上。
                    `;
                    
                    // Reset form
                    form.reset();
                    fileButton.textContent = FILE_BUTTON_LABEL;
                    fileButton.style.background = "#667eea";
                    fileButton.style.borderColor = "#667eea";
                } else {
                    response.className = "response error";
                    response.innerHTML = `
                        <strong>❌ 訊息分享失敗！</strong><br>
                        ${escapeHtml(result.error || '請再試一次。')}
                    `;
                }
                
            } catch (error) {
                loading.style.display = "none";
                submitBtn.disabled = false;
                submitBtn.textContent = SUBMIT_LABEL;
                
                response.style.display = "block";
                response.className = "response error";
                response.innerHTML = `
                    <strong>❌ 連線錯誤</strong><br>
                    請檢查網絡連線後再試一次。
                `;
            }
        });
    </script>
</body>
</html>
