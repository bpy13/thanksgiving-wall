[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thanksgiving-wall"
version = "1.1.0"
description = "Live thanksgiving message and photo wall for church meetings"
requires-python = ">=3.12"
license = "Apache-2.0"
# Keep in step with requirements.txt (pinned versions used by the Docker image).
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pillow>=11.0",
    "psycopg[binary,pool]>=3.2",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools]
py-modules = ["db", "upload", "display"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
